[package]
name = "infimount_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "fs"] }
thiserror = "2.0.18"
base64 = "0.22"
indexmap = "2.13.0"

[target.'cfg(windows)'.dependencies]
opendal = { version = "0.56.0", features = ["services-fs", "services-s3", "services-webdav", "services-azblob", "services-gcs", "services-b2", "services-oss", "services-cos", "services-obs", "services-ftp", "services-memory"] }

[target.'cfg(not(windows))'.dependencies]
opendal = { version = "0.56.0", features = ["services-fs", "services-s3", "services-webdav", "services-azblob", "services-gcs", "services-b2", "services-oss", "services-cos", "services-obs", "services-sftp", "services-ftp", "services-memory"] }
