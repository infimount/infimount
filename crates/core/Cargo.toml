[package]
name = "infimount_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "fs"] }
chrono = { version = "0.4", features = ["clock"] }
thiserror = "2.0.18"
base64 = "0.22"
indexmap = "2.13.0"
keyring = { version = "=4.1.5", default-features = false, features = ["v1"] }
age = { version = "0.12", default-features = false, features = ["armor"] }
age-core = "0.12"
sha2 = "0.10"
zeroize = "1.8"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
minisign-verify = "0.2.4"
minisign = "0.9"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
opendal = { version = "0.58.1", features = ["services-fs", "services-s3", "services-webdav", "services-azblob", "services-gcs", "services-b2", "services-oss", "services-cos", "services-obs", "services-ftp", "services-gdrive", "services-onedrive", "services-memory"] }

[target.'cfg(not(windows))'.dependencies]
opendal = { version = "0.58.1", features = ["services-fs", "services-s3", "services-webdav", "services-azblob", "services-gcs", "services-b2", "services-oss", "services-cos", "services-obs", "services-sftp", "services-ftp", "services-gdrive", "services-onedrive", "services-memory"] }
