[package]
name = "infimount_hosted"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "infimount-hosted"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
bytes = "1"
futures = "0.3"
http-body = "1"
http-body-util = "0.1"
infimount_core = { path = "../core" }
infimount_mcp = { path = "../mcp" }
jsonwebtoken = { version = "=12.0.0", default-features = false, features = ["rust_crypto"] }
opendal = { version = "0.58.1", features = ["services-fs", "services-s3", "services-memory"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "1.4.0", features = ["transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
