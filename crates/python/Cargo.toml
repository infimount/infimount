[package]
name = "infimount_python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
infimount_core = { path = "../core" }
infimount_mcp = { path = "../mcp" }
opendal = { version = "0.58.1", features = ["services-fs", "services-s3", "layers-timeout"] }
pyo3 = { version = "=0.30.1", features = ["abi3-py310"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "sync", "time", "net", "fs"] }
tracing = "0.1"
url = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
