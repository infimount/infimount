name: Feature request
description: Suggest or brainstorm an improvement (not authorization to implement)
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user pain point does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Clear, concrete behavior and UX.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: browser_impact
    attributes:
      label: Impact on the storage browser
      description: Describe any changes to storage-only onboarding, browse/preview/search, transfer UX, or regression coverage. Write "none" if not applicable.

  - type: markdown
    attributes:
      value: "Ideas remain exploratory until a separate explicit product decision approves implementation. See PRODUCT.md for the decision gate."

  - type: textarea
    id: additional
    attributes:
      label: Additional context
