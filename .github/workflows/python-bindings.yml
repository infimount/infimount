name: Python Binding Qualification

on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        default: ""
        type: string
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/python-bindings.yml"
      - ".github/workflows/release.yml"
      - "crates/**"
      - "python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/check-distribution-assets.py"
      - "scripts/build-python-sdist.py"
      - "scripts/test-python-sdist.py"
      - "scripts/sync-release-version.mjs"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/python-bindings.yml"
      - ".github/workflows/release.yml"
      - "crates/**"
      - "python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/check-distribution-assets.py"
      - "scripts/build-python-sdist.py"
      - "scripts/test-python-sdist.py"
      - "scripts/sync-release-version.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-bindings-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_BUILD_JOBS: "4"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  wheel:
    name: Native wheel (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: windows-amd64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Apply release version to locked manifests
        if: inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/sync-release-version.mjs "$RELEASE_TAG"
      - name: Build the ABI3 wheel on its native architecture
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "v1.16.0"
          rust-toolchain: "1.94.0"
          target: ${{ matrix.target }}
          manylinux: "2_28"
          working-directory: python
          args: --locked --release --out dist -i python3.10
          before-script-linux: dnf -y --setopt=timeout=30 --setopt=retries=3 install openssl-devel pkgconf-pkg-config
      - name: Install and test the wheel on CPython 3.10
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps python/dist/*.whl
          python -m unittest discover -s python/tests -v
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Reuse the same wheel on CPython 3.14
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps python/dist/*.whl
          python -m unittest discover -s python/tests -v
      - uses: actions/upload-artifact@v6
        with:
          name: python-${{ matrix.platform }}-artifacts
          path: python/dist/*.whl
          if-no-files-found: error

  source:
    name: Source archive and isolated rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-source-msrv
      - name: Install build dependencies
        run: bash scripts/ci-apt-install.sh pkg-config libssl-dev
      - name: Apply release version to locked manifests
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/sync-release-version.mjs "$RELEASE_TAG"
      - name: Strict Rust checks for the governed binding
        run: |
          cargo +1.94.0 clippy -p infimount_python --all-targets --locked -- -D warnings
          cargo +1.94.0 test -p infimount_python --locked
      - name: Build source archive and rebuild outside the checkout
        run: |
          set -euo pipefail
          python -m pip install 'maturin==1.16.0'
          cargo +1.94.0 fetch --locked
          python scripts/test-python-sdist.py -v
          python scripts/build-python-sdist.py --out python/dist
          mkdir -p "$RUNNER_TEMP/python-source-rebuild"
          python -m pip wheel --no-deps --no-build-isolation --config-settings=maturin.build-args=--locked \
            --wheel-dir "$RUNNER_TEMP/python-source-rebuild" python/dist/*.tar.gz
          python -m pip install --no-deps "$RUNNER_TEMP"/python-source-rebuild/*.whl
          python -m unittest discover -s python/tests -v
      - name: Qualify the installed source-built wheel against synthetic S3
        run: |
          python -m pip install 'moto[server,s3]==5.2.6'
          python python/qualify_s3.py
      - uses: actions/upload-artifact@v6
        with:
          name: python-source-artifacts
          path: python/dist/*.tar.gz
          if-no-files-found: error

  inventory:
    name: Verify complete distribution inventory
    needs: [wheel, source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*-artifacts
          merge-multiple: true
          path: distribution
      - name: Verify wheel metadata and all native platforms
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          python scripts/check-distribution-assets.py distribution "$tag" --python-only
