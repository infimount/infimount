name: Age Scrypt Compatibility Lock Preview

on:
  pull_request:
    branches: ["main"]
    paths:
      - "crates/core/Cargo.toml"
      - ".github/workflows/age-scrypt-lock-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate-lock-preview:
    name: Scope age downgrade lock update
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/security-age-scrypt-compat-0387' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
      - name: Resolve only the age 0.11.5 update
        run: cargo update -p age --precise 0.11.5
      - name: Print changed Cargo lock entries for review
        run: |
          printf '\n===BEGIN_AGE_CARGO_LOCK_DIFF===\n'
          git diff --no-ext-diff -- Cargo.lock | sed 's/^/AGE_LOCK_PATCH: /'
          printf '\n===END_AGE_CARGO_LOCK_DIFF===\n'
          cargo tree -i crypto-bigint || true
      - name: Check exact build with resolved lock
        run: cargo +1.94.0 check -p infimount_core --all-targets --locked
