name: Dependency Audit

on:
  pull_request:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rust-audit:
    name: Rust Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Verify documented rsa exception dependency tree
        run: |
          set -euo pipefail
          cargo tree --workspace --invert rsa@0.9.10 | tee /tmp/rsa-tree.txt
          grep -Fq 'rsa v0.9.10' /tmp/rsa-tree.txt
          grep -Fq 'reqsign-azure-storage v3.2.0' /tmp/rsa-tree.txt
      - name: Run cargo audit
        # RUSTSEC-2023-0071 has no fixed rsa release. Keep this exact exception
        # visible and re-evaluate it when a fixed `rsa` release is available.
        run: cargo audit --ignore RUSTSEC-2023-0071

  js-audit:
    name: JavaScript Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        run: pnpm audit --prod --audit-level=high
