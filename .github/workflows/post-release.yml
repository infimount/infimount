name: Post Release Validation

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate, for example v0.7.0
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-release:
    name: Validate Published Release
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            tag="${{ github.event.workflow_run.head_branch }}"
          else
            tag="${{ github.event.inputs.tag }}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Post-release validation requires a SemVer release tag, got '$tag'" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Apply tag version before consistency validation
        run: |
          GITHUB_REF_NAME="${{ steps.release.outputs.tag }}" \
            node scripts/sync-release-version.mjs "${{ steps.release.outputs.tag }}"

      - name: Verify version, docs, changelog, and release notes
        env:
          INFIMOUNT_REQUIRE_PUBLISHED_RELEASE: "1"
        run: node scripts/check-release-consistency.mjs "${{ steps.release.outputs.tag }}"

      - name: Verify feature documentation consistency
        run: node scripts/check-feature-docs.mjs

      - name: Verify published release links
        env:
          INFIMOUNT_RELEASE_BASE_URL: https://github.com/infimount/infimount/releases/download/${{ steps.release.outputs.tag }}
        run: ./scripts/check-release-links.sh

      - name: Install exact release MSRV (Rust 1.94)
        uses: dtolnay/rust-toolchain@1.120

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Re-download and validate published assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf published-release-assets
          mkdir published-release-assets
          gh release download "$RELEASE_TAG" --dir published-release-assets
          ./scripts/check-release-assets.sh published-release-assets
          ./scripts/check-updater-assets.sh published-release-assets "${RELEASE_TAG#v}"
          node scripts/check-upgrade-fixtures.mjs published-release-assets
          python scripts/check-distribution-assets.py published-release-assets "$RELEASE_TAG" --revision "$(git rev-parse HEAD)"

          public_key="$(jq -r '.plugins.updater.pubkey' apps/desktop/src-tauri/tauri.conf.json)"
          while IFS= read -r signature; do
            artifact="${signature%.sig}"
            test -s "$artifact"
            cargo run --quiet -p infimount_core --bin verify_updater_signature -- \
              "$public_key" "$artifact" "$signature"
          done < <(find published-release-assets -maxdepth 1 -type f -name '*.sig' | sort)

          while IFS= read -r url; do
            case "$url" in
              "https://github.com/infimount/infimount/releases/download/${RELEASE_TAG}/"*) ;;
              *) echo "Updater URL is not pinned to $RELEASE_TAG: $url" >&2; exit 1 ;;
            esac
            curl --fail --silent --show-error --location --head --retry 5 "$url" >/dev/null
          done < <(jq -r '.platforms[].url' published-release-assets/latest.json)

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published image provenance and digest-pinned execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="$(jq -er .image published-release-assets/hosted-image.json)"
          digest="$(jq -er .digest published-release-assets/hosted-image.json)"
          gh attestation verify "oci://$image@$digest" --repo "$GITHUB_REPOSITORY"
          docker buildx imagetools inspect "$image@$digest" --format '{{json .Manifest}}' > image-manifest.json
          python - <<'PY'
          import json
          expected = json.load(open("published-release-assets/hosted-image.json"))
          actual = json.load(open("image-manifest.json"))
          assert actual["digest"] == expected["digest"]
          assert len(actual["manifests"]) == 2
          observed = {f'{row["platform"]["os"]}/{row["platform"]["architecture"]}': row["digest"] for row in actual["manifests"]}
          assert observed == {row["platform"]: row["digest"] for row in expected["platforms"]}
          PY
          docker pull --platform linux/amd64 "$image@$digest"
          docker run --rm --platform linux/amd64 --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --mount type=bind,src="$PWD/deploy/hosted/example-local.json",dst=/run/hosted.json,readonly \
            "$image@$digest" check --config /run/hosted.json

      - name: Install Linux installer-upgrade dependencies
        run: bash scripts/ci-apt-install.sh xvfb gnome-keyring dbus-x11 libsecret-tools

      - name: Exercise published previous-stable to candidate Linux installer upgrade
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          bash scripts/smoke-linux-upgrade-install.sh \
            published-release-assets/Infimount-amd64.deb \
            "${RELEASE_TAG#v}"

      - name: Verify Homebrew update can resolve checksums
        if: ${{ !contains(steps.release.outputs.tag, '-') }}
        run: ./scripts/check-homebrew-update.sh "${{ steps.release.outputs.tag }}"

      - name: Dispatch Homebrew tap update when token is configured
        if: ${{ !contains(steps.release.outputs.tag, '-') }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [[ -z "${TAP_TOKEN}" ]]; then
            echo "HOMEBREW_TAP_DISPATCH_TOKEN is not configured; skipping tap dispatch."
            exit 0
          fi

          version="${RELEASE_TAG#v}"
          curl --fail --silent --show-error --location \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TAP_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/infimount/homebrew-infimount/dispatches \
            -d "{\"event_type\":\"infimount-release\",\"client_payload\":{\"version\":\"${version}\"}}"
