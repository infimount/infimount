name: Temporary age security resolver (remove before merge)

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/security-age-resolver.yml"
      - "crates/core/Cargo.toml"

permissions:
  contents: read

jobs:
  update-age-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.94.0
      - name: Resolve pinned age dependencies
        run: |
          cargo update -p age --precise 0.11.5
          cargo update -p age-core --precise 0.11.0
          echo "::group::Cargo lockfile diff"
          git --no-pager diff -- Cargo.lock
          echo "::endgroup::"
          if grep -A3 '^name = "crypto-bigint"' Cargo.lock | grep -q '^version = "0.5.5"'; then
            echo "::error::Still locks vulnerable crypto-bigint 0.5.5"
            exit 1
          fi
          cargo +1.94.0 metadata --locked --no-deps --format-version 1 > /dev/null


  baseline-age-012-backup-fixture:
    name: Generate synthetic v0.8.1 backup ciphertext
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 891938583c84d2331ff641cf9e530628370f3875
          path: baseline
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.94.0
      - name: Install build dependencies
        run: |
          cd baseline
          bash scripts/ci-apt-install.sh libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Generate old-age backup fixture with synthetic data only
        run: |
          mkdir -p baseline/crates/core/src/bin
          cat > baseline/crates/core/src/bin/security_age_fixture.rs <<'RUST'
          use std::collections::HashMap;
          use infimount_core::backup::{BackupPayload, encrypt_backup};

          fn main() {
              let payload = BackupPayload::new(
                  vec![serde_json::json!({"id":"compat-storage","name":"Synthetic v0.8.1 backup"})],
                  None,
                  None,
                  None,
                  HashMap::new(),
              )
              .unwrap();
              let armored = encrypt_backup("infimount-public-test-passphrase", &payload).unwrap();
              println!("BEGIN_SYNTHETIC_V081_AGE012_BACKUP");
              print!("{}", armored);
              println!("\nEND_SYNTHETIC_V081_AGE012_BACKUP");
          }
          RUST
          cd baseline
          cargo +1.94.0 run -p infimount_core --bin security_age_fixture --locked --quiet
