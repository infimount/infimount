name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  release-signing-preflight:
    name: Release Gate / Signing Policy
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.policy.outputs.stable }}
    steps:
      - uses: actions/checkout@v6
      - name: Require updater signing for every release and platform signing for stable tags
        id: policy
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Every release requires updater signing; policy is implemented by the shared checker.
          result="$(bash scripts/check-signing-policy-rehearsal.sh)"
          printf '%s\n' "$result"
          stable="$(printf '%s\n' "$result" | awk -F= '/^stable=/{print $2}')"
          printf 'stable=%s\n' "$stable" >> "$GITHUB_OUTPUT"

  release-frontend-gate:
    name: Release Gate / Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Frontend coverage gate
        run: pnpm test:coverage:frontend

      - name: Production build
        run: pnpm build

  release-ui-gate:
    name: Release Gate / Playwright UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: UI/component tests
        run: pnpm test:ui

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-ui-artifacts
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report

  release-rust-gate:
    name: Release Gate / Rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install exact release MSRV (Rust 1.94)
        uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt, clippy

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::result_large_err -A clippy::needless_borrows_for_generic_args

      - name: Rust tests
        run: cargo test --workspace

      - name: Rust coverage gate
        run: ./scripts/coverage-rust.sh

  release-desktop-smoke:
    name: Release Gate / Desktop Smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Desktop launch/migration smoke
        run: ./scripts/smoke-desktop.sh

      - name: Activation, secret migration, and recovery smoke
        run: |
          ./scripts/smoke-activation.sh
          ./scripts/smoke-secret-migration.sh
          ./scripts/smoke-backup-restore.sh

  release-storage-simulator:
    name: Release Gate / Storage Simulator
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install simulator CLIs
        run: ./scripts/install-storage-simulator-clis-linux.sh

      - name: Run storage simulator gate
        run: ./scripts/storage-simulator-gate.sh

  release-consistency-gate:
    name: Release Gate / Release Consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Apply tag version before consistency validation
        run: node scripts/sync-release-version.mjs

      - name: Verify version, docs, changelog, and release notes
        run: node scripts/check-release-consistency.mjs "${GITHUB_REF_NAME}"

      - name: Verify feature documentation consistency
        run: node scripts/check-feature-docs.mjs

      - name: Verify committed upgrade fixtures
        run: node scripts/check-upgrade-fixtures.mjs

      - name: Smoke install scripts with checksum fixtures
        run: ./scripts/smoke-install-scripts.sh

  release-policy-gate:
    name: Release Gate / Zero Manual Policy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Verify zero-manual release gate policy
        run: ./scripts/check-zero-manual-release-gate.sh

      - name: Verify canonical and Windows installer release versions
        run: node scripts/check-release-version-model.mjs

      - name: Verify packaged-sidecar checksum smoke fixtures
        run: ./scripts/test-packaged-sidecar-checksum.sh

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    # Every platform build is blocked on signing policy before compilation.
    needs:
      - release-signing-preflight
      - release-frontend-gate
      - release-ui-gate
      - release-rust-gate
      - release-desktop-smoke
      - release-storage-simulator
      - release-consistency-gate
      - release-policy-gate

    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Apply tag version to app manifests
        run: node scripts/sync-release-version.mjs

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb rpm cpio unzip file

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: apps/desktop
        run: pnpm build

      - name: Prepare and smoke target sidecar
        run: node scripts/prepare-mcp-sidecar.mjs && bash scripts/smoke-mcp-sidecar.sh

      - name: Build Tauri app
        working-directory: apps/desktop
        run: pnpm tauri build

      - name: Collect Linux release assets
        run: |
          mkdir -p out/linux/sbom-components
          APPIMAGE="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | sort | head -n 1)"
          DEB="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | sort | head -n 1)"
          RPM="$(find target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm' | sort | head -n 1)"
          cp "$APPIMAGE" out/linux/Infimount-x86_64.AppImage
          cp "$DEB" out/linux/Infimount-amd64.deb
          cp "$RPM" out/linux/Infimount-x86_64.rpm
          SIDECAR_TREE="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$SIDECAR_TREE"
          SIDECAR="$(find "$SIDECAR_TREE" -type f -name 'mcp*' -perm -111 | sort | head -n 1)"
          test -x "$SIDECAR"
          cp "$SIDECAR" out/linux/sbom-components/infimount_mcp-linux
          rm -rf "$SIDECAR_TREE"

      - name: Collect Linux updater artifacts
        run: |
          set -euo pipefail
          mkdir -p out/linux/updater
          VERSION="${GITHUB_REF#refs/tags/v}"
          PUB_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) PLATFORM_ARCH="x86_64" ;;
            aarch64|arm64) PLATFORM_ARCH="aarch64" ;;
            *) PLATFORM_ARCH="$ARCH" ;;
          esac
          PLATFORM_KEY="linux-${PLATFORM_ARCH}"

          LATEST_JSON="$(find target/release/bundle -type f -name 'latest*.json' | sort | head -n 1)"
          if [ -n "${LATEST_JSON}" ]; then
            cp "${LATEST_JSON}" out/linux/updater/latest-linux.json
          fi

          SIG_FILES=()
          while IFS= read -r line; do
            SIG_FILES+=("$line")
          done < <(find target/release/bundle -type f -name '*.sig' | sort)

          if [ "${#SIG_FILES[@]}" -eq 0 ]; then
            echo "No updater signature files generated. Check TAURI_SIGNING_PRIVATE_KEY." >&2
            exit 1
          fi

          UPDATER_SIG=""
          UPDATER_ARTIFACT=""
          for sig in "${SIG_FILES[@]}"; do
            artifact="${sig%.sig}"
            cp "$sig" out/linux/updater/
            if [ -f "$artifact" ]; then
              cp "$artifact" out/linux/updater/
              if [ -z "$UPDATER_SIG" ] && [[ "$artifact" == *.tar.gz || "$artifact" == *.zip || "$artifact" == *.AppImage ]]; then
                UPDATER_SIG="$sig"
                UPDATER_ARTIFACT="$artifact"
              fi
            fi
          done

          if [ -z "${LATEST_JSON}" ]; then
            if [ -z "$UPDATER_SIG" ] || [ -z "$UPDATER_ARTIFACT" ]; then
              echo "No updater latest*.json and no signed updater archive (*.tar.gz|*.AppImage|*.zip) found." >&2
              exit 1
            fi

            SIG_VALUE="$(tr -d '\r\n' < "$UPDATER_SIG")"
            UPDATER_ARTIFACT_NAME="$(basename "$UPDATER_ARTIFACT")"
            jq -n \
              --arg version "$VERSION" \
              --arg notes "See release notes." \
              --arg pub_date "$PUB_DATE" \
              --arg platform "$PLATFORM_KEY" \
              --arg signature "$SIG_VALUE" \
              --arg url "https://github.com/infimount/infimount/releases/download/${GITHUB_REF_NAME}/${UPDATER_ARTIFACT_NAME}" \
              '{
                version: $version,
                notes: $notes,
                pub_date: $pub_date,
                platforms: {
                  ($platform): {
                    signature: $signature,
                    url: $url
                  }
                }
              }' > out/linux/updater/latest-linux.json
          fi

      - name: Smoke check Linux artifacts
        run: ./scripts/smoke-linux-release-artifacts.sh out/linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-artifacts
          path: out/linux/*
          if-no-files-found: warn

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    # Every platform build is blocked on signing policy before compilation.
    needs:
      - release-signing-preflight
      - release-frontend-gate
      - release-ui-gate
      - release-rust-gate
      - release-desktop-smoke
      - release-storage-simulator
      - release-consistency-gate
      - release-policy-gate

    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Apply tag version to app manifests
        run: node scripts/sync-release-version.mjs

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: apps/desktop
        run: pnpm build

      - name: Prepare and smoke target sidecar
        run: node scripts/prepare-mcp-sidecar.mjs && bash scripts/smoke-mcp-sidecar.sh

      - name: Detect macOS signing configuration
        id: apple_signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${APPLE_CERTIFICATE}" ] \
            && [ -n "${APPLE_CERTIFICATE_PASSWORD}" ] \
            && [ -n "${APPLE_SIGNING_IDENTITY}" ] \
            && [ -n "${APPLE_ID}" ] \
            && [ -n "${APPLE_PASSWORD}" ] \
            && [ -n "${APPLE_TEAM_ID}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app (signed + notarized)
        if: ${{ steps.apple_signing.outputs.enabled == 'true' }}
        working-directory: apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build

      - name: Build Tauri app (unsigned prerelease fallback)
        if: ${{ steps.apple_signing.outputs.enabled != 'true' && needs.release-signing-preflight.outputs.stable != 'true' }}
        working-directory: apps/desktop
        run: pnpm tauri build

      - name: Collect macOS release assets
        run: |
          mkdir -p out/macos/sbom-components
          DMG="$(find target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | sort | head -n 1)"
          cp "$DMG" out/macos/Infimount.dmg

      - name: Collect macOS updater artifacts
        run: |
          set -euo pipefail
          mkdir -p out/macos/updater
          VERSION="${GITHUB_REF#refs/tags/v}"
          PUB_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) PLATFORM_ARCH="x86_64" ;;
            aarch64|arm64) PLATFORM_ARCH="aarch64" ;;
            *) PLATFORM_ARCH="$ARCH" ;;
          esac
          PLATFORM_KEY="darwin-${PLATFORM_ARCH}"

          LATEST_JSON="$(find target/release/bundle -type f -name 'latest*.json' | sort | head -n 1)"
          if [ -n "${LATEST_JSON}" ]; then
            cp "${LATEST_JSON}" out/macos/updater/latest-macos.json
          fi

          SIG_FILES=()
          while IFS= read -r line; do
            SIG_FILES+=("$line")
          done < <(find target/release/bundle -type f -name '*.sig' | sort)

          if [ "${#SIG_FILES[@]}" -eq 0 ]; then
            echo "No updater signature files generated. Check TAURI_SIGNING_PRIVATE_KEY." >&2
            exit 1
          fi

          UPDATER_SIG=""
          UPDATER_ARTIFACT=""
          for sig in "${SIG_FILES[@]}"; do
            artifact="${sig%.sig}"
            cp "$sig" out/macos/updater/
            if [ -f "$artifact" ]; then
              cp "$artifact" out/macos/updater/
              if [ -z "$UPDATER_SIG" ] && [[ "$artifact" == *.tar.gz || "$artifact" == *.zip ]]; then
                UPDATER_SIG="$sig"
                UPDATER_ARTIFACT="$artifact"
              fi
            fi
          done

          if [ -z "${LATEST_JSON}" ]; then
            if [ -z "$UPDATER_SIG" ] || [ -z "$UPDATER_ARTIFACT" ]; then
              echo "No updater latest*.json and no signed updater archive (*.tar.gz|*.zip) found." >&2
              exit 1
            fi

            SIG_VALUE="$(tr -d '\r\n' < "$UPDATER_SIG")"
            UPDATER_ARTIFACT_NAME="$(basename "$UPDATER_ARTIFACT")"
            jq -n \
              --arg version "$VERSION" \
              --arg notes "See release notes." \
              --arg pub_date "$PUB_DATE" \
              --arg platform "$PLATFORM_KEY" \
              --arg signature "$SIG_VALUE" \
              --arg url "https://github.com/infimount/infimount/releases/download/${GITHUB_REF_NAME}/${UPDATER_ARTIFACT_NAME}" \
              '{
                version: $version,
                notes: $notes,
                pub_date: $pub_date,
                platforms: {
                  ($platform): {
                    signature: $signature,
                    url: $url
                  }
                }
              }' > out/macos/updater/latest-macos.json
          fi

      - name: Smoke check macOS artifact
        env:
          APPLE_SIGNED: ${{ steps.apple_signing.outputs.enabled }}
        run: |
          set -euo pipefail
          test -s out/macos/Infimount.dmg
          hdiutil verify out/macos/Infimount.dmg
          MOUNT_OUTPUT="$(hdiutil attach out/macos/Infimount.dmg -nobrowse -readonly)"
          DEVICE="$(echo "$MOUNT_OUTPUT" | awk '/^\/dev\// { print $1; exit }')"
          VOLUME_PATH="$(echo "$MOUNT_OUTPUT" | awk '/\/Volumes\// { print $NF; exit }')"
          test -n "$DEVICE"
          test -n "$VOLUME_PATH"
          test -d "$VOLUME_PATH/Infimount.app"
          SIDECAR="$(find "$VOLUME_PATH/Infimount.app" -type f -name 'mcp*' -perm -111 | sort | head -n 1)"
          test -n "$SIDECAR"
          test "$("$SIDECAR" --version)" = "infimount_mcp ${GITHUB_REF#refs/tags/v}"
          cp "$SIDECAR" out/macos/sbom-components/infimount_mcp-macos
          if [ "$APPLE_SIGNED" = "true" ]; then
            codesign --verify --strict --verbose=2 "$SIDECAR"
            codesign --verify --deep --strict --verbose=2 "$VOLUME_PATH/Infimount.app"
            spctl --assess --type execute --verbose=2 "$VOLUME_PATH/Infimount.app"
            xcrun stapler validate "$VOLUME_PATH/Infimount.app"
            xcrun stapler validate out/macos/Infimount.dmg
            for archive in out/macos/updater/*.tar.gz out/macos/updater/*.zip; do
              [ -f "$archive" ] || continue
              updater_dir="$(mktemp -d)"
              case "$archive" in
                *.tar.gz) tar -xzf "$archive" -C "$updater_dir" ;;
                *.zip) ditto -x -k "$archive" "$updater_dir" ;;
              esac
              updater_app="$(find "$updater_dir" -type d -name 'Infimount.app' | head -n 1)"
              test -n "$updater_app"
              updater_sidecar="$(find "$updater_app" -type f -name 'mcp*' -perm -111 | head -n 1)"
              test -n "$updater_sidecar"
              codesign --verify --strict --verbose=2 "$updater_sidecar"
              codesign --verify --deep --strict --verbose=2 "$updater_app"
              rm -rf "$updater_dir"
            done
          fi
          hdiutil detach "$DEVICE"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-artifacts
          path: out/macos/*
          if-no-files-found: warn

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    # Every platform build is blocked on signing policy before compilation.
    needs:
      - release-signing-preflight
      - release-frontend-gate
      - release-ui-gate
      - release-rust-gate
      - release-desktop-smoke
      - release-storage-simulator
      - release-consistency-gate
      - release-policy-gate

    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Apply canonical tag version to app and sidecar manifests
        run: node scripts/sync-release-version.mjs

      - name: Apply MSI-safe numeric version only to the WiX bundle
        run: node scripts/set-windows-installer-version.mjs

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: apps/desktop
        run: pnpm build

      - name: Configure Windows signing certificate
        id: windows_signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "infimount-codesign.pfx"
          [System.IO.File]::WriteAllBytes(
            $certPath,
            [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate -or -not $certificate.HasPrivateKey) {
            throw "Windows signing certificate import failed or has no private key"
          }
          if ($certificate.NotBefore -gt (Get-Date) -or $certificate.NotAfter -lt (Get-Date)) {
            throw "Windows signing certificate is not currently valid"
          }
          $codeSigningEku = $certificate.Extensions |
            Where-Object { $_.Oid.Value -eq "2.5.29.37" } |
            ForEach-Object { $_.EnhancedKeyUsages } |
            Where-Object { $_.ObjectId.Value -eq "1.3.6.1.5.5.7.3.3" }
          if (-not $codeSigningEku) { throw "Windows certificate is not valid for code signing" }
          "enabled=true" >> $env:GITHUB_OUTPUT
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          "certificate_path=$certPath" >> $env:GITHUB_OUTPUT

      - name: Prepare and smoke target sidecar
        shell: bash
        run: node scripts/prepare-mcp-sidecar.mjs && bash scripts/smoke-mcp-sidecar.sh

      - name: Sign packaged Windows sidecar before bundling
        if: ${{ steps.windows_signing.outputs.enabled == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = (where.exe signtool.exe | Select-Object -First 1)
          if (-not $signtool) { throw "signtool.exe not found on runner" }
          $sidecar = Get-ChildItem apps/desktop/src-tauri/binaries/mcp-*.exe | Select-Object -First 1
          if (-not $sidecar) { throw "prepared Windows MCP sidecar was not found" }
          & $signtool sign /fd SHA256 /f "${{ steps.windows_signing.outputs.certificate_path }}" /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $sidecar.FullName
          if ($LASTEXITCODE -ne 0) { throw "failed to sign packaged Windows MCP sidecar" }
          & $signtool verify /pa /all /v $sidecar.FullName
          if ($LASTEXITCODE -ne 0) { throw "packaged Windows MCP sidecar signature verification failed" }
          $hash = (Get-FileHash -Algorithm SHA256 $sidecar.FullName).Hash.ToLowerInvariant()
          "$hash  $($sidecar.Name)" | Set-Content -Encoding ascii "$($sidecar.FullName).sha256"
          "$hash  mcp" | Set-Content -Encoding ascii "apps/desktop/src-tauri/binaries/mcp.sha256"

      - name: Build signed Tauri app and updater chain
        if: ${{ steps.windows_signing.outputs.enabled == 'true' }}
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $config = @{
            build = @{
              beforeBuildCommand = ""
            }
            bundle = @{
              windows = @{
                certificateThumbprint = "${{ steps.windows_signing.outputs.thumbprint }}"
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          }
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.windows-signing.conf.json"
          $config | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $configPath
          pnpm tauri build --config $configPath
          if ($LASTEXITCODE -ne 0) { throw "signed Tauri build failed" }

      - name: Build unsigned Tauri prerelease
        if: ${{ steps.windows_signing.outputs.enabled != 'true' && needs.release-signing-preflight.outputs.stable != 'true' }}
        working-directory: apps/desktop
        run: pnpm tauri build

      - name: Verify Windows Authenticode chain
        if: ${{ steps.windows_signing.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          $signtool = (where.exe signtool.exe | Select-Object -First 1)
          if (-not $signtool) { throw "signtool.exe not found on runner" }
          $signedFiles = @(
            Get-Item target/release/infimount.exe
            Get-ChildItem apps/desktop/src-tauri/binaries/mcp-*.exe
            Get-ChildItem target/release/bundle -Recurse -File | Where-Object { $_.Extension -in @(".exe", ".msi") }
          ) | Sort-Object FullName -Unique
          if ($signedFiles.Count -lt 4) { throw "expected signed Windows application, sidecar, and installer artifacts were not found" }
          foreach ($file in $signedFiles) {
            & $signtool verify /pa /all /v $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed: $($file.FullName)" }
          }

          $updaterArchives = Get-ChildItem target/release/bundle -Recurse -File -Filter *.zip
          foreach ($archive in $updaterArchives) {
            $destination = Join-Path $env:RUNNER_TEMP ("verify-updater-" + [guid]::NewGuid())
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $destination
            $archiveExecutables = Get-ChildItem $destination -Recurse -File | Where-Object { $_.Extension -in @(".exe", ".msi") }
            if (-not $archiveExecutables) { throw "updater archive contains no signed executable or MSI: $($archive.FullName)" }
            $archiveSidecar = Get-ChildItem $destination -Recurse -File -Filter mcp*.exe | Select-Object -First 1
            if (-not $archiveSidecar) {
              $archiveMsi = Get-ChildItem $destination -Recurse -File -Filter *.msi | Select-Object -First 1
              if ($archiveMsi) {
                $msiDestination = Join-Path $destination "msi-extracted"
                New-Item -ItemType Directory -Force -Path $msiDestination | Out-Null
                $process = Start-Process msiexec.exe -ArgumentList @("/a", $archiveMsi.FullName, "/qn", "TARGETDIR=$msiDestination") -Wait -PassThru
                if ($process.ExitCode -ne 0) { throw "could not extract updater MSI: $($archiveMsi.FullName)" }
                $archiveSidecar = Get-ChildItem $msiDestination -Recurse -File -Filter mcp*.exe | Select-Object -First 1
              }
            }
            if (-not $archiveSidecar) { throw "updater archive is missing the bundled MCP sidecar: $($archive.FullName)" }
            $archiveSidecarVersion = & $archiveSidecar.FullName --version
            $expectedVersion = $env:GITHUB_REF -replace '^refs/tags/v', ''
            if ($archiveSidecarVersion.Trim() -ne "infimount_mcp $expectedVersion") {
              throw "updater archive sidecar version mismatch: $archiveSidecarVersion"
            }
            & $signtool verify /pa /all /v $archiveSidecar.FullName
            if ($LASTEXITCODE -ne 0) { throw "updater sidecar signature verification failed: $($archiveSidecar.FullName)" }
            foreach ($file in $archiveExecutables) {
              & $signtool verify /pa /all /v $file.FullName
              if ($LASTEXITCODE -ne 0) { throw "updater payload signature verification failed: $($file.FullName)" }
            }
          }

      - name: Collect Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/windows/sbom-components | Out-Null
          $msi = Get-ChildItem -Path target/release/bundle/msi/*.msi | Select-Object -First 1
          $exe = Get-ChildItem -Path target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $msi.FullName out/windows/Infimount.msi
          Copy-Item $exe.FullName out/windows/Infimount-setup.exe

      - name: Collect Windows updater artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/windows/updater | Out-Null
          $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $arch = switch ($env:RUNNER_ARCH) {
            "X64" { "x86_64" }
            "ARM64" { "aarch64" }
            default { $env:RUNNER_ARCH.ToLowerInvariant() }
          }
          $platformKey = "windows-$arch"

          $latest = Get-ChildItem -Path target/release/bundle -Recurse -Filter "latest*.json" | Sort-Object FullName | Select-Object -First 1
          if ($latest) {
            Copy-Item $latest.FullName "out/windows/updater/latest-windows.json"
          }

          $sigFiles = Get-ChildItem -Path target/release/bundle -Recurse -Filter "*.sig" | Sort-Object FullName
          if (-not $sigFiles -or $sigFiles.Count -eq 0) {
            throw "No updater signature files generated. Check TAURI_SIGNING_PRIVATE_KEY."
          }

          $updaterSig = $null
          $updaterArtifact = $null
          foreach ($sig in $sigFiles) {
            Copy-Item $sig.FullName out/windows/updater/
            $artifact = $sig.FullName.Substring(0, $sig.FullName.Length - 4)
            if (Test-Path $artifact) {
              Copy-Item $artifact out/windows/updater/
              if (-not $updaterSig -and ($artifact.EndsWith(".zip") -or $artifact.EndsWith(".tar.gz") -or $artifact.EndsWith(".exe") -or $artifact.EndsWith(".msi"))) {
                $updaterSig = $sig
                $updaterArtifact = $artifact
              }
            }
          }

          if (-not $latest) {
            if (-not $updaterSig -or -not $updaterArtifact) {
              throw "No updater latest*.json and no signed updater archive (*.tar.gz|*.zip|*.exe|*.msi) found."
            }

            $sigValue = (Get-Content $updaterSig.FullName -Raw).Trim()
            $artifactName = Split-Path -Leaf $updaterArtifact
            $url = "https://github.com/infimount/infimount/releases/download/$env:GITHUB_REF_NAME/$artifactName"
            $latestObject = [ordered]@{
              version = $version
              notes = "See release notes."
              pub_date = $pubDate
              platforms = [ordered]@{
                $platformKey = [ordered]@{
                  signature = $sigValue
                  url = $url
                }
              }
            }

            $latestObject | ConvertTo-Json -Depth 10 | Out-File -FilePath out/windows/updater/latest-windows.json -Encoding utf8NoBOM
          }

      - name: Smoke check Windows artifacts
        shell: pwsh
        env:
          WINDOWS_SIGNED: ${{ steps.windows_signing.outputs.enabled }}
        run: |
          $msiPath = "out/windows/Infimount.msi"
          $exePath = "out/windows/Infimount-setup.exe"

          if ((Get-Item $msiPath).Length -le 0) { throw "MSI file is empty" }
          if ((Get-Item $exePath).Length -le 0) { throw "EXE file is empty" }

          $exeHeader = [System.IO.File]::ReadAllBytes($exePath)[0..1]
          if ($exeHeader[0] -ne 0x4D -or $exeHeader[1] -ne 0x5A) {
            throw "EXE does not have MZ header"
          }

          $extractDir = Join-Path $env:RUNNER_TEMP "infimount-nsis"
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          & 7z x -y $exePath "-o$extractDir" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect NSIS package" }
          $sidecar = Get-ChildItem -Path $extractDir -Recurse -Filter "mcp*.exe" | Select-Object -First 1
          if (-not $sidecar) { throw "Bundled MCP sidecar was not found in Windows installer" }
          $reportedVersion = & $sidecar.FullName --version
          $expectedVersion = $env:GITHUB_REF -replace '^refs/tags/v', ''
          if ($reportedVersion.Trim() -ne "infimount_mcp $expectedVersion") {
            throw "Bundled MCP sidecar version mismatch: $reportedVersion"
          }
          if ($env:WINDOWS_SIGNED -eq "true") {
            $signtool = (where.exe signtool.exe | Select-Object -First 1)
            Get-ChildItem $extractDir -Recurse -File -Filter *.exe | ForEach-Object {
              & $signtool verify /pa /all /v $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "NSIS embedded executable signature verification failed: $($_.FullName)" }
            }
          }

          $msiExtractDir = Join-Path $env:RUNNER_TEMP "infimount-msi"
          New-Item -ItemType Directory -Force -Path $msiExtractDir | Out-Null
          $msiProcess = Start-Process msiexec.exe -ArgumentList @(
            "/a", (Resolve-Path $msiPath).Path,
            "/qn", "TARGETDIR=$msiExtractDir"
          ) -Wait -PassThru
          if ($msiProcess.ExitCode -ne 0) { throw "Could not administratively extract MSI" }
          $msiSidecar = Get-ChildItem -Path $msiExtractDir -Recurse -Filter "mcp*.exe" | Select-Object -First 1
          if (-not $msiSidecar) { throw "Bundled MCP sidecar was not found in MSI" }
          $msiReportedVersion = & $msiSidecar.FullName --version
          if ($msiReportedVersion.Trim() -ne "infimount_mcp $expectedVersion") {
            throw "MSI sidecar version mismatch: $msiReportedVersion"
          }
          Copy-Item $msiSidecar.FullName out/windows/sbom-components/infimount_mcp-windows.exe -Force
          if ($env:WINDOWS_SIGNED -eq "true") {
            Get-ChildItem $msiExtractDir -Recurse -File -Filter *.exe | ForEach-Object {
              & $signtool verify /pa /all /v $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "MSI embedded executable signature verification failed: $($_.FullName)" }
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-artifacts
          path: out/windows/*
          if-no-files-found: warn

  create-release:
    name: Validate and Publish Release
    needs: [build-linux, build-macos, build-windows, release-signing-preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install Rust for updater signature verification
        uses: dtolnay/rust-toolchain@stable

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp artifacts/linux-artifacts/Infimount-amd64.deb release-assets/
          cp artifacts/linux-artifacts/Infimount-x86_64.rpm release-assets/
          cp artifacts/linux-artifacts/Infimount-x86_64.AppImage release-assets/
          cp artifacts/macos-artifacts/Infimount.dmg release-assets/
          cp artifacts/windows-artifacts/Infimount.msi release-assets/
          cp artifacts/windows-artifacts/Infimount-setup.exe release-assets/
          cp scripts/install.sh release-assets/
          cp scripts/install.ps1 release-assets/

          for dir in artifacts/linux-artifacts/updater artifacts/macos-artifacts/updater artifacts/windows-artifacts/updater; do
            if [ -d "$dir" ]; then
              cp "$dir"/* release-assets/
            fi
          done

      - name: Cryptographically verify updater signatures
        run: |
          set -euo pipefail
          public_key="$(jq -r '.plugins.updater.pubkey' apps/desktop/src-tauri/tauri.conf.json)"
          test -n "$public_key"
          shopt -s nullglob
          signatures=(release-assets/*.sig)
          test "${#signatures[@]}" -gt 0
          for signature in "${signatures[@]}"; do
            artifact="${signature%.sig}"
            test -s "$artifact"
            cargo run --quiet -p infimount_core --bin verify_updater_signature -- \
              "$public_key" "$artifact" "$signature"
          done

      - name: Merge updater metadata
        run: |
          set -euo pipefail
          shopt -s nullglob
          latest_files=(release-assets/latest-*.json)
          if [ "${#latest_files[@]}" -eq 0 ]; then
            echo "No updater latest-*.json files were collected from build jobs." >&2
            exit 1
          fi

          jq -s '{
            version: (.[0].version // ""),
            notes: (.[0].notes // ""),
            pub_date: (.[0].pub_date // null),
            platforms: (reduce .[] as $item ({}; . + ($item.platforms // {})))
          }' "${latest_files[@]}" > release-assets/latest.json

      - name: Validate merged updater metadata and references
        run: |
          ./scripts/check-updater-assets.sh release-assets "${GITHUB_REF#refs/tags/v}"
          rm -f release-assets/latest-linux.json release-assets/latest-macos.json release-assets/latest-windows.json

      - name: Prepare complete SBOM input including bundled sidecars
        run: |
          set -euo pipefail
          rm -rf sbom-input
          mkdir -p sbom-input/sidecars
          cp release-assets/* sbom-input/
          find artifacts -type f -path '*/sbom-components/infimount_mcp*' -exec cp {} sbom-input/sidecars/ \;
          test "$(find sbom-input/sidecars -type f -name 'infimount_mcp*' | wc -l)" -ge 3

      - name: Generate mandatory SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: sbom-input
          output-file: release-assets/SBOM.spdx.json
          format: spdx-json

      - name: Add explicit bundled-sidecar component to SBOM
        run: node scripts/add-sidecar-to-sbom.mjs release-assets/SBOM.spdx.json sbom-input/sidecars "${GITHUB_REF#refs/tags/v}"

      - name: Verify SBOM covers bundled sidecar
        run: |
          test -s release-assets/SBOM.spdx.json
          jq -e --arg version "${GITHUB_REF#refs/tags/v}" '
            (.packages[] | select(.name == "infimount_mcp")) as $sidecar |
            ($sidecar.versionInfo == $version and ($sidecar.hasFiles | length >= 3)) and
            ([
              $sidecar.hasFiles[] as $id |
              .files[] |
              select(.SPDXID == $id and any(.checksums[]?; .algorithm == "SHA256" and (.checksumValue | length == 64)))
            ] | length >= 3)
          ' release-assets/SBOM.spdx.json >/dev/null

      - name: Generate checksums for every published payload
        run: |
          set -euo pipefail
          cd release-assets
          rm -f SHA256SUMS.txt ./*.sha256
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${#files[@]}" -gt 0
          sha256sum "${files[@]}" > SHA256SUMS.txt
          for file in "${files[@]}"; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Validate release assets, updater references, SBOM, and checksums
        run: |
          ./scripts/check-release-assets.sh release-assets
          ./scripts/check-updater-assets.sh release-assets "${GITHUB_REF#refs/tags/v}"
          node scripts/check-upgrade-fixtures.mjs release-assets

      - name: Smoke install scripts against release assets
        run: ./scripts/smoke-install-scripts.sh release-assets

      - name: Attest release assets provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Create validated draft release
        uses: softprops/action-gh-release@v2
        with:
          name: Infimount ${{ steps.get_version.outputs.VERSION }}
          draft: true
          prerelease: ${{ needs.release-signing-preflight.outputs.stable != 'true' }}
          generate_release_notes: true
          files: |
            release-assets/*
          body: |
            ## Infimount ${{ steps.get_version.outputs.VERSION }}

            ### Install with one command

            Linux:

            ```bash
            curl -fsSL https://github.com/infimount/infimount/releases/download/${{ github.ref_name }}/install.sh | INFIMOUNT_VERSION=${{ github.ref_name }} sh
            ```

            macOS:

            ```bash
            curl -fsSL https://github.com/infimount/infimount/releases/download/${{ github.ref_name }}/install.sh | INFIMOUNT_VERSION=${{ github.ref_name }} sh
            ```

            Windows PowerShell:

            ```powershell
            $env:INFIMOUNT_VERSION='${{ github.ref_name }}'; irm https://github.com/infimount/infimount/releases/download/${{ github.ref_name }}/install.ps1 | iex
            ```

            ### Manual downloads

            | Platform | File |
            |----------|------|
            | Linux (Debian/Ubuntu) | `.deb` |
            | Linux (Fedora/RHEL) | `.rpm` |
            | Linux (Universal) | `.AppImage` |
            | macOS | `.dmg` |
            | Windows | `.msi` or `.exe` |

            ### Integrity

            This release includes `SHA256SUMS.txt` and per-file `.sha256` checksum files.
            Verify downloads before install:

            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ### Supply Chain Metadata

            This release includes:

            - `SBOM.spdx.json` (software bill of materials, SPDX JSON)
            - GitHub artifact attestation for release assets (provenance)
            - `latest.json` + signed updater archives for in-app auto-update

            ### Signing status

            **${{ needs.release-signing-preflight.outputs.stable == 'true' && 'SIGNED STABLE RELEASE' || 'SIGNED UPDATER; PLATFORM SIGNING MAY BE OMITTED — PRERELEASE ONLY' }}**

            Every release passes mandatory updater-signing preflight. Stable tags additionally require macOS and Windows platform signing. Prerelease applications may omit platform signing; verify the release is marked prerelease before using one.

            See [CHANGELOG.md](https://github.com/infimount/infimount/blob/main/CHANGELOG.md) for details.

      - name: Re-download and validate draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf downloaded-release-assets
          mkdir downloaded-release-assets
          gh release download "$GITHUB_REF_NAME" --dir downloaded-release-assets
          ./scripts/check-release-assets.sh downloaded-release-assets
          ./scripts/check-updater-assets.sh downloaded-release-assets "${GITHUB_REF#refs/tags/v}"
          node scripts/check-upgrade-fixtures.mjs downloaded-release-assets
          (cd downloaded-release-assets && sha256sum --check SHA256SUMS.txt)

          public_key="$(jq -r '.plugins.updater.pubkey' apps/desktop/src-tauri/tauri.conf.json)"
          while IFS= read -r signature; do
            artifact="${signature%.sig}"
            test -s "$artifact"
            cargo run --quiet -p infimount_core --bin verify_updater_signature -- \
              "$public_key" "$artifact" "$signature"
          done < <(find downloaded-release-assets -maxdepth 1 -type f -name '*.sig' | sort)

          uploaded_assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          while IFS= read -r url; do
            asset="${url##*/}"
            grep -Fxq "$asset" <<<"$uploaded_assets" || {
              echo "Draft release is missing updater URL target: $asset" >&2
              exit 1
            }
            grep -Fxq "$asset.sig" <<<"$uploaded_assets" || {
              echo "Draft release is missing updater signature: $asset.sig" >&2
              exit 1
            }
          done < <(jq -r '.platforms[].url' downloaded-release-assets/latest.json)

      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_STABLE: ${{ needs.release-signing-preflight.outputs.stable }}
        run: |
          set -euo pipefail
          if [ "$IS_STABLE" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=true
          fi

      - name: Re-download and validate published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf published-release-assets
          mkdir published-release-assets
          for attempt in 1 2 3 4 5; do
            rm -f published-release-assets/*
            if gh release download "$GITHUB_REF_NAME" --dir published-release-assets; then
              break
            fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          ./scripts/check-release-assets.sh published-release-assets
          ./scripts/check-updater-assets.sh published-release-assets "${GITHUB_REF#refs/tags/v}"
          node scripts/check-upgrade-fixtures.mjs published-release-assets

          public_key="$(jq -r '.plugins.updater.pubkey' apps/desktop/src-tauri/tauri.conf.json)"
          while IFS= read -r signature; do
            artifact="${signature%.sig}"
            test -s "$artifact"
            cargo run --quiet -p infimount_core --bin verify_updater_signature -- \
              "$public_key" "$artifact" "$signature"
          done < <(find published-release-assets -maxdepth 1 -type f -name '*.sig' | sort)

          while IFS= read -r url; do
            case "$url" in
              "https://github.com/infimount/infimount/releases/download/${GITHUB_REF_NAME}/"*) ;;
              *) echo "Updater URL is not pinned to ${GITHUB_REF_NAME}: $url" >&2; exit 1 ;;
            esac
            curl --fail --silent --show-error --location --head --retry 5 "$url" >/dev/null
          done < <(jq -r '.platforms[].url' published-release-assets/latest.json)
