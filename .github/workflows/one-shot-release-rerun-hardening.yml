name: One-shot release rerun hardening

on:
  push:
    branches:
      - fix/release-draft-rerun-isolation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/release-draft-rerun-isolation

      - name: Apply fail-closed release publisher hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          release_path = Path('.github/workflows/release.yml')
          policy_path = Path('scripts/check-zero-manual-release-gate.sh')

          release = release_path.read_text()

          old_download = (
              "      - name: Download all artifacts\n"
              "        uses: actions/download-artifact@v7\n"
              "        with:\n"
              "          path: artifacts\n"
          )
          new_download = (
              "      - name: Download platform build artifacts only\n"
              "        uses: actions/download-artifact@v7\n"
              "        with:\n"
              "          pattern: '*-artifacts'\n"
              "          path: artifacts\n"
          )

          if release.count(old_download) != 1:
              raise SystemExit(f'expected exactly one publisher artifact-download block, found {release.count(old_download)}')
          release = release.replace(old_download, new_download)

          old_sbom = (
              "      - name: Generate mandatory SBOM (SPDX JSON)\n"
              "        uses: anchore/sbom-action@v0\n"
              "        with:\n"
              "          path: sbom-input\n"
              "          output-file: release-assets/SBOM.spdx.json\n"
              "          format: spdx-json\n"
          )
          new_sbom = (
              "      - name: Generate mandatory SBOM (SPDX JSON)\n"
              "        uses: anchore/sbom-action@v0\n"
              "        with:\n"
              "          path: sbom-input\n"
              "          output-file: release-assets/SBOM.spdx.json\n"
              "          format: spdx-json\n"
              "          # The publisher owns the curated release asset set. Anchore's\n"
              "          # implicit uploads contaminate an existing draft on reruns with\n"
              "          # its pre-augmentation SBOM, which is intentionally not present\n"
              "          # in SHA256SUMS.txt.\n"
              "          upload-artifact: false\n"
              "          upload-release-assets: false\n"
          )

          if release.count(old_sbom) != 1:
              raise SystemExit(f'expected exactly one mandatory SBOM block, found {release.count(old_sbom)}')
          release = release.replace(old_sbom, new_sbom)
          release_path.write_text(release)

          policy = policy_path.read_text()
          anchor = 'require_file_contains "$RELEASE_WORKFLOW" "add-sidecar-to-sbom.mjs"\n'
          addition = (
              'require_file_contains "$RELEASE_WORKFLOW" "pattern: \'*-artifacts\'"\n'
              'require_file_contains "$RELEASE_WORKFLOW" "upload-artifact: false"\n'
              'require_file_contains "$RELEASE_WORKFLOW" "upload-release-assets: false"\n'
              'if grep -Fq -- "upload-release-assets: true" "$RELEASE_WORKFLOW"; then\n'
              '  fail "SBOM generation must not implicitly publish release assets"\n'
              'fi\n'
          )
          if policy.count(anchor) != 1:
              raise SystemExit(f'expected exactly one policy insertion anchor, found {policy.count(anchor)}')
          policy = policy.replace(anchor, anchor + addition)
          policy_path.write_text(policy)
          PY

          bash scripts/check-zero-manual-release-gate.sh
          git diff --check

      - name: Export patched files as Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          create_blob() {
            local file="$1"
            local payload
            payload="$(python3 - "$file" <<'PY'
          import base64, json, pathlib, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          print(json.dumps({"content": base64.b64encode(data).decode(), "encoding": "base64"}))
          PY
          )"
            curl --fail --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
              -d "$payload" | jq -r '.sha'
          }

          release_blob="$(create_blob .github/workflows/release.yml)"
          policy_blob="$(create_blob scripts/check-zero-manual-release-gate.sh)"

          test -n "$release_blob" && test "$release_blob" != null
          test -n "$policy_blob" && test "$policy_blob" != null

          echo "RELEASE_BLOB_SHA=$release_blob"
          echo "POLICY_BLOB_SHA=$policy_blob"
