name: Sync Version After Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (example: v0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync-version:
    name: Sync stable release identity from release tag
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Resolve tag
        id: resolve_tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable SemVer tags can update stable public identity: ${TAG}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "GITHUB_REF_NAME=${TAG}" >> "$GITHUB_ENV"

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Sync versions from tag
        run: node scripts/sync-release-version.mjs

      - name: Promote public documentation to stable identity
        run: |
          if grep -Fq 'Release candidate under validation' README.md; then
            node scripts/prepare-stable-release-docs.mjs "${{ steps.resolve_tag.outputs.tag }}"
          else
            echo "Public documentation is already promoted to a stable identity."
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/sync-version-${{ steps.resolve_tag.outputs.tag }}
          title: "chore(release): sync versions for ${{ steps.resolve_tag.outputs.tag }}"
          commit-message: "chore(release): sync versions for ${{ steps.resolve_tag.outputs.tag }}"
          body: |
            Automated post-release version sync.

            Source tag: `${{ steps.resolve_tag.outputs.tag }}`

            Updated files include the root/frontend/Tauri manifest versions and, when needed, stable-release identity in README, CHANGELOG, GitHub Pages, and docs/llms.txt.
          labels: |
            chore
            release
          delete-branch: true
