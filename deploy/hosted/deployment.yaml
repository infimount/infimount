apiVersion: apps/v1
kind: Deployment
metadata:
  name: infimount-hosted
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: infimount-hosted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infimount-hosted
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: storage
          image: infimount-hosted:local
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/run/infimount/hosted.json"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 1Gi
              ephemeral-storage: 2Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: storage.example.com
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: storage.example.com
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: storage.example.com
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /run/infimount
              readOnly: true
            - name: artifacts
              mountPath: /data/artifacts
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: infimount-hosted-config
        - name: artifacts
          persistentVolumeClaim:
            claimName: infimount-artifacts
        - name: scratch
          emptyDir:
            sizeLimit: 1Gi
